<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كشف رابط غير موثوق</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0d17;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* خلفية تساقط النجوم */
        canvas#stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* حاوية المحتوى الرئيسي */
        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 480px;
            background: rgba(20, 24, 45, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* مستطيل العنوان العلوي */
        .header-box {
            background: linear-gradient(135deg, #1e2544, #2a345e);
            padding: 15px;
            border-radius: 10px;
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #e0e6ff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* مستطيل إدخال الرابط */
        .input-box {
            margin-bottom: 20px;
        }

        .input-box input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 2px solid #333c66;
            background-color: #0f1322;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-box input:focus {
            border-color: #4c6fff;
        }

        /* الزر الأخضر */
        .btn-search {
            width: 100%;
            padding: 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .btn-search:hover {
            background-color: #218838;
        }

        .btn-search:active {
            transform: scale(0.98);
        }

        /* مستطيل عرض النتيجة */
        .result-box {
            margin-top: 25px;
            padding: 16px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .result-safe {
            background-color: rgba(40, 167, 69, 0.2);
            border: 2px solid #28a745;
            color: #2ecc71;
        }

        .result-unsafe {
            background-color: rgba(220, 53, 69, 0.2);
            border: 2px solid #dc3545;
            color: #ff4d4d;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- خلفية النجوم المتحركة -->
    <canvas id="stars"></canvas>

    <div class="container">
        <!-- مستطيل العنوان -->
        <div class="header-box">
            كشف رابط غير موثوق
        </div>

        <!-- مستطيل إدخال الرابط -->
        <div class="input-box">
            <input type="text" id="urlInput" placeholder="أدخل الرابط هنا (مثال: example.com)" autocomplete="off">
        </div>

        <!-- الزر الأخضر -->
        <button class="btn-search" onclick="checkUrl()">بحث</button>

        <!-- مستطيل النتيجة -->
        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        // أنيميشن تساقط النجوم من الأعلى للأسفل
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const starCount = 120;
        const stars = [];

        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.8 + 0.5,
                speed: Math.random() * 1.5 + 0.5,
                opacity: Math.random()
            });
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.fill();

                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            requestAnimationFrame(animateStars);
        }
        animateStars();

        // فحص الرابط وإرساله للبايثون
        async function checkUrl() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (!urlInput) {
                resultBox.style.display = 'block';
                resultBox.className = 'result-box result-unsafe';
                resultBox.innerText = 'يرجى كتابة رابط أولاً ⛔️';
                return;
            }

            resultBox.style.display = 'block';
            resultBox.className = 'result-box';
            resultBox.style.borderColor = '#4c6fff';
            resultBox.style.color = '#fff';
            resultBox.innerText = 'جاري الفحص... ⏳';

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();

                if (data.is_safe) {
                    resultBox.className = 'result-box result-safe';
                    resultBox.innerText = 'الموقع امن ✅️';
                } else {
                    resultBox.className = 'result-box result-unsafe';
                    resultBox.innerText = 'الموقع غير امن ⛔️';
                }
            } catch (err) {
                resultBox.className = 'result-box result-unsafe';
                resultBox.innerText = 'الموقع غير امن ⛔️';
            }
        }
    </script>
</body>
</html>
